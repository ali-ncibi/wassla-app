[project]
name = "wassla-pipeline"
version = "0.1.0"
description = "Wassla agentic news pipeline: RSS ingest, multilingual LLM processing, QA evaluation, RAG search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "feedparser>=6.0.11",
    "langchain-core>=0.3.60",
    "langgraph>=0.4",
    "arize-phoenix-otel>=0.1",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.30",
    "arize-phoenix>=1.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pyright>=1.1.414",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "PTH", "ASYNC", "EM", "TRY", "RUF", "COM"]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"evals/run_evals.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[[tool.mypy.overrides]]
module = ["feedparser", "asyncpg"]
ignore_missing_imports = true
